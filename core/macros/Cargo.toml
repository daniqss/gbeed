[package]
name = "gbeed-macros"
description = "Internal proc macros of gbeed-core, generating its C interface from the platform traits"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/daniqss/gbeed"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.101"
quote = "1.0.41"
syn = { version = "2.0.106", features = ["full"] }
