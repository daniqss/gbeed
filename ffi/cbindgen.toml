# Generates ffi/include/gbeed.h from gbeed-core, see ffi/ffi.just
language = "C"
include_guard = "GBEED_H"
cpp_compat = true
usize_is_size_t = true
style = "both"
# only freestanding headers, so it can be used on embedded targets without a libc
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
autogen_warning = "/* Generated with cbindgen from gbeed-core, do not edit by hand. Regenerate with `just ffi header` */"

[parse.expand]
# the callback structs are generated by gbeed-macros, only visible once expanded (requires nightly)
crates = ["gbeed-core"]
features = ["ffi"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
